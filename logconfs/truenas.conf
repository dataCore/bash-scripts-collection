# =============================================================================
# Fluent Bit - TrueNAS Syslog Input
# Path: /etc/fluent-bit/conf.d/truenas.conf
# Deploy on: dataCoreLog03 (receives remote syslog from TrueNAS)
# Variables: host_ip, vlan, o2_host, o2_org (set in datacore.conf),
#            o2_user, o2_passwd (set in datacore.env)
#
# SOURCE (VLAN 20, same subnet as the receiver - no firewall rule needed):
#   dataCoreFS04  192.168.20.13  TrueNAS
#
# TRUENAS CONFIGURATION (WebUI):
#   System -> Advanced Settings -> Syslog
#   Syslog Server:      192.168.20.33:5142
#   Transport:          UDP
#   Syslog Level:       Info
#   Use FQDN:           off (short hostname fills the host field)
#   Include Audit Logs: as desired (SMB/API audit trail, can be noisy)
#
# NOTE: Port 5142 instead of 514 to avoid running Fluent Bit as root.
#       5140 is taken by the UniFi receiver (unifi.conf), 5141 by the
#       BMC receiver (bmc.conf).
# NOTE: Like bmc.conf the host field is NOT overridden here: the parser
#       fills it from the syslog header ("datacorefs04", lowercase).
# NOTE: TrueNAS sends RFC5424 without fractional seconds (verified
#       2026-08-17), which neither packaged parser accepts — hence the
#       custom truenas-rfc5424 parser from datacore-parsers.conf.
# =============================================================================

[INPUT]
    Name          syslog
    Mode          udp
    Listen        0.0.0.0
    Port          5142
    Tag           truenas.*
    Parser        truenas-rfc5424

[FILTER]
    Name          record_modifier
    Match         truenas.*
    Record        log_type  truenas
    Record        vlan      ${vlan}
    Record        host_ip   ${host_ip}

[OUTPUT]
    Name          http
    Match         truenas.*
    Host          ${o2_host}
    Port          443
    TLS           On
    TLS.Verify    On
    URI           /api/${o2_org}/truenas_logs/_json
    Format        json
    HTTP_User     ${o2_user}
    HTTP_Passwd   ${o2_passwd}
    compress      gzip
    Retry_Limit   5
