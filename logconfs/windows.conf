# =============================================================================
# Fluent Bit - Windows Event Log Input
# Path: C:\ProgramData\fluent-bit\conf.d\windows.conf
# Deploy on: All Windows Server hosts (always deployed by install-log.ps1)
# Variables: host_ip, vlan, o2_host, o2_org, fb_data (set in datacore.conf),
#            o2_user, o2_passwd (set in datacore-secrets.conf)
#
# Deployed by install-log.ps1 — do not install by hand. The installer's own
# C:\Program Files\fluent-bit\conf\fluent-bit.conf is overwritten by every
# package update, so nothing of ours lives there.
#
# DB keeps the event log bookmark across restarts, so events logged while
# Fluent Bit was down are shipped afterwards.
#
# winevtlog (Windows Event Log API) replaces the legacy winlog input. Its DB
# format differs, so it uses its own file; Read_Existing_Events Off makes a
# fresh DB start at the current end instead of shipping the whole history.
# Field names differ from winlog: ProviderName (was SourceName), Computer
# (ComputerName), EventRecordID (RecordNumber), TimeCreated (TimeGenerated/
# TimeWritten), Level as number (EventType as text), Task (EventCategory),
# UserID (Sid). EventID, Channel, Message, Qualifiers, StringInserts stay.
# Tag winlog.* is kept so Match rules and stream routing do not change.
# =============================================================================

# --- Input: Windows System, Application, Security logs ---
[INPUT]
    Name                  winevtlog
    Tag                   winlog.events
    Channels              Setup,System,Security,Application
    Interval_Sec          5
    Read_Existing_Events  Off
    DB                    ${fb_data}\db\fluent-bit-winevtlog.db
    storage.type          filesystem

[FILTER]
    Name          record_modifier
    Match         winlog.*
    Record        host      ${HOSTNAME}
    Record        log_type  windows
    Record        vlan      ${vlan}
    Record        host_ip   ${host_ip}

# --- Output: OpenObserve - windows_events stream ---
[OUTPUT]
    Name          http
    Match         winlog.*
    Host          ${o2_host}
    Port          443
    TLS           On
    TLS.Verify    On
    TLS.Verify_Hostname  On
    URI           /api/${o2_org}/windows_events/_json
    Format        json
    HTTP_User     ${o2_user}
    HTTP_Passwd   ${o2_passwd}
    compress      gzip
    Retry_Limit   no_limits
    storage.total_limit_size  256M
