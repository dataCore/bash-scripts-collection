# =============================================================================
# Fluent Bit - Windows Event Log Input
# Path: C:\fluent-bit\conf\conf.d\windows.conf
# Deploy on: Windows Server hosts (AD DCs, etc.)
# Variables: host_ip, vlan, o2_host, o2_org, o2_user, o2_passwd
#            (set in the Windows main config, see below — Windows has no
#             package manager conffile, so editing fluent-bit.conf is fine here)
#
# INSTALLATION (Windows Server):
#
#   Option A: winget (recommended - enables easy updates)
#     winget install Calyptia.fluent-bit
#     winget upgrade Calyptia.fluent-bit
#
#   Option B: MSI installer
#     Download from https://fluentbit.io/download/ (Windows x86_64 MSI)
#     Install to C:\fluent-bit\
#
#   After installation:
#     Create folder:  C:\fluent-bit\conf\conf.d\
#     Copy this file: windows.conf → C:\fluent-bit\conf\conf.d\windows.conf
#
#   Edit C:\fluent-bit\conf\fluent-bit.conf — install-log.sh is Linux-only, so
#   the main config is written by hand here:
#     [SERVICE]
#         Flush        5
#         Log_Level    warn
#         Parsers_File C:\fluent-bit\conf\parsers.conf
#     @SET o2_host=log.geek.ch
#     @SET o2_org=default
#     @SET host_ip=<host ip>
#     @SET vlan=<vlan id>
#     @SET o2_user=<ingest user>
#     @SET o2_passwd=<ingest password>
#     @INCLUDE C:\fluent-bit\conf\conf.d\windows.conf
#
#   Set COMPUTERNAME environment variable if not set (usually automatic):
#     [System Properties > Advanced > Environment Variables]
#
#   Start service:
#     sc start fluent-bit
#
# =============================================================================

# --- Input: Windows System, Application, Security logs ---
[INPUT]
    Name          winlog
    Channels      Setup,System,Security,Application
    Interval_Sec  5
    DB            C:\fluent-bit\fluent-bit-winlog.db

# --- Input: Active Directory specific event logs ---
[INPUT]
    Name          winlog
    Channels      Directory Service,DNS Server,File Replication Service
    Interval_Sec  10
    DB            C:\fluent-bit\fluent-bit-adlog.db

[FILTER]
    Name          record_modifier
    Match         *
    Record        host      ${COMPUTERNAME}
    Record        log_type  windows
    Record        vlan      ${vlan}
    Record        host_ip   ${host_ip}

[OUTPUT]
    Name          http
    Match         *
    Host          ${o2_host}
    Port          443
    TLS           On
    TLS.Verify    On
    URI           /api/${o2_org}/windows_events/_json
    Format        json
    HTTP_User     ${o2_user}
    HTTP_Passwd   ${o2_passwd}
    compress      gzip
    Retry_Limit   5
