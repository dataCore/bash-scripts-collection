# =============================================================================
# Fluent Bit - hMailServer Log Input
# Path: C:\ProgramData\fluent-bit\conf.d\hmail.conf
# Deploy on: hMailServer hosts (install-log.ps1 -Hmail)
# Variables: host_ip, vlan, o2_host, o2_org, fb_data (set in datacore.conf),
#            o2_user, o2_passwd (set in datacore-secrets.conf)
#
# hMailServer logs are daily-rotated text files:
#   C:\Program Files (x86)\hMailServer\Logs\hmailserver_YYYY-MM-DD.log
#   C:\Program Files (x86)\hMailServer\Logs\ERROR_hmailserver_YYYY-MM-DD.log
# Ignore_Older 2d: tail keeps one file descriptor per matched file, and the
# old daily files pile up - only the current day receives new lines.
#
# NOTE: Ensure logging is enabled in hMailServer Administrator:
#   Settings > Logging > Enabled
# =============================================================================

# --- Input: hMailServer daily activity logs ---
[INPUT]
    Name             tail
    Tag              hmail.activity
    Path             C:\Program Files (x86)\hMailServer\Logs\hmailserver_*.log
    Exclude_Path     C:\Program Files (x86)\hMailServer\Logs\ERROR_*.log,C:\Program Files (x86)\hMailServer\Logs\hmailserver_awstats.log
    DB               ${fb_data}\db\fluent-bit-hmail.db
    Refresh_Interval 10
    Ignore_Older     2d
    Skip_Long_Lines  On
    storage.type     filesystem

# --- Input: hMailServer error logs ---
[INPUT]
    Name             tail
    Tag              hmail.error
    Path             C:\Program Files (x86)\hMailServer\Logs\ERROR_hmailserver_*.log
    DB               ${fb_data}\db\fluent-bit-hmail-error.db
    Refresh_Interval 10
    Ignore_Older     2d
    Skip_Long_Lines  On
    storage.type     filesystem

[FILTER]
    Name          record_modifier
    Match         hmail.*
    Record        host      ${HOSTNAME}
    Record        log_type  hmail
    Record        vlan      ${vlan}
    Record        host_ip   ${host_ip}

# --- Output: OpenObserve - hmail stream ---
[OUTPUT]
    Name          http
    Match         hmail.*
    Host          ${o2_host}
    Port          443
    TLS           On
    TLS.Verify    On
    TLS.Verify_Hostname  On
    URI           /api/${o2_org}/hmail/_json
    Format        json
    HTTP_User     ${o2_user}
    HTTP_Passwd   ${o2_passwd}
    compress      gzip
    Retry_Limit   no_limits
    storage.total_limit_size  256M
