# =============================================================================
# Fluent Bit - UniFi / UDM Pro Max Syslog Input
# Path: /etc/fluent-bit/conf.d/unifi.conf
# Deploy on: dataCoreLog03 (receives syslog from UDM Pro Max)
# Variables: host_ip, vlan, o2_host, o2_org (set in datacore.conf),
#            o2_user, o2_passwd (set in datacore.env)
#
# UNIFI CONFIGURATION:
#   UniFi Network → Settings → System → Remote Logging
#   Enable Syslog:  On
#   Syslog Host:    192.168.20.33
#   Syslog Port:    5140
#   Log Level:      Info (or Debug for more detail)
#
# NOTE: Port 5140 instead of 514 to avoid running Fluent Bit as root.
# =============================================================================

[INPUT]
    Name          syslog
    Mode          udp
    Listen        0.0.0.0
    Port          5140
    Tag           unifi.*
    Parser        syslog-rfc3164

[FILTER]
    Name          record_modifier
    Match         unifi.*
    Record        host      unifi-udm
    Record        log_type  unifi
    Record        vlan      ${vlan}
    Record        host_ip   ${host_ip}

[OUTPUT]
    Name          http
    Match         unifi.*
    Host          ${o2_host}
    Port          443
    TLS           On
    TLS.Verify    On
    URI           /api/${o2_org}/unifi/_json
    Format        json
    HTTP_User     ${o2_user}
    HTTP_Passwd   ${o2_passwd}
    compress      gzip
    Retry_Limit   5
