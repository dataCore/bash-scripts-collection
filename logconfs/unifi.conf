# =============================================================================
# Fluent Bit - UniFi / UDM Pro Max Syslog Input
# Path: /etc/fluent-bit/conf.d/unifi.conf
# Deploy on: dataCoreLog03 (receives syslog from UDM Pro Max)
# Variables: host_ip, vlan, o2_host, o2_org (set in datacore.conf),
#            o2_user, o2_passwd (set in datacore.env)
#
# UNIFI CONFIGURATION (Network app 10.x):
#   UniFi Network → CyberSecure → Traffic Logging
#   Activity Logging (Syslog):  SIEM Server
#   Server Address:             192.168.20.33
#   Port:                       5140
#   Contents:                   all except Debug Logs
#   Netconsole:                 off
#
# NOTE: Port 5140 instead of 514 to avoid running Fluent Bit as root.
# NOTE: The SIEM export sends CEF in a BSD-syslog envelope without a <pri>
#       prefix — no packaged parser matches, hence unifi-cef from
#       datacore-parsers.conf. The host field comes from the syslog header
#       (the controller, e.g. "dataCoreFW05"); events of adopted devices
#       arrive via the controller and carry the device in the CEF payload.
# NOTE: Listens on ${host_ip} only, not 0.0.0.0 - UDP syslog is unauthenticated,
#       so the receiver stays off every other interface (e.g. Docker bridges).
#       Restricting the senders is the job of the host/zone firewall.
# =============================================================================

[INPUT]
    Name          syslog
    Mode          udp
    Listen        ${host_ip}
    Port          5140
    Tag           unifi.*
    Parser        unifi-cef
    storage.type  filesystem

[FILTER]
    Name          record_modifier
    Match         unifi.*
    Record        log_type  unifi
    Record        vlan      ${vlan}
    Record        host_ip   ${host_ip}

[OUTPUT]
    Name          http
    Match         unifi.*
    Host          ${o2_host}
    Port          443
    TLS           On
    TLS.Verify    On
    URI           /api/${o2_org}/unifi/_json
    Format        json
    HTTP_User     ${o2_user}
    HTTP_Passwd   ${o2_passwd}
    compress      gzip
    Retry_Limit   30
    storage.total_limit_size  256M
