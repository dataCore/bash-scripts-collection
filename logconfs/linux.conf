# =============================================================================
# Fluent Bit - Linux Syslog Input
# Path: /etc/fluent-bit/conf.d/linux.conf
# Deploy on: All Debian and Proxmox hosts
# Variables: host_ip, vlan, o2_user, o2_passwd (set in fluent-bit.conf)
# =============================================================================

[INPUT]
    Name              systemd
    Tag               syslog.*
    Read_From_Tail    On
    Strip_Underscores On

[FILTER]
    Name          record_modifier
    Match         syslog.*
    Record        host      ${HOSTNAME}
    Record        log_type  syslog
    Record        vlan      ${vlan}
    Record        host_ip   ${host_ip}

[OUTPUT]
    Name          http
    Match         syslog.*
    Host          ${o2_host}
    Port          443
    TLS           On
    TLS.Verify    On
    URI           /api/${o2_org}/syslog/_json
    Format        json
    HTTP_User     ${o2_user}
    HTTP_Passwd   ${o2_passwd}
    compress      gzip
    Retry_Limit   5
