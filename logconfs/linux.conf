# =============================================================================
# Fluent Bit - Linux Syslog Input
# Path: /etc/fluent-bit/conf.d/linux.conf
# Deploy on: All Debian and Proxmox hosts
# Variables: host_ip, vlan, o2_host, o2_org (set in datacore.conf),
#            o2_user, o2_passwd (set in datacore.env)
#
# DB keeps the journal cursor across restarts: without it the input starts at
# the journal tail every time and loses whatever was logged while Fluent Bit
# was down or restarting. Read_From_Tail only applies to the very first start
# (no cursor yet), so a fresh install does not ship the whole journal.
# =============================================================================

[INPUT]
    Name              systemd
    Tag               syslog.*
    Read_From_Tail    On
    DB                /var/lib/fluent-bit/systemd.db
    Strip_Underscores On
    storage.type      filesystem

[FILTER]
    Name          record_modifier
    Match         syslog.*
    Record        host      ${HOSTNAME}
    Record        log_type  syslog
    Record        vlan      ${vlan}
    Record        host_ip   ${host_ip}

[OUTPUT]
    Name          http
    Match         syslog.*
    Host          ${o2_host}
    Port          443
    TLS           On
    TLS.Verify    On
    URI           /api/${o2_org}/syslog/_json
    Format        json
    HTTP_User     ${o2_user}
    HTTP_Passwd   ${o2_passwd}
    compress      gzip
    Retry_Limit   30
    storage.total_limit_size  256M
