# =============================================================================
# Fluent Bit - Proxmox Task Log Input
# Path: /etc/fluent-bit/conf.d/proxmox.conf
# Deploy on: Proxmox nodes only (always combine with linux.conf)
# Variables: host_ip, vlan, o2_host, o2_org (set in datacore.conf),
#            o2_user, o2_passwd (set in datacore.env)
#
# PVE writes one file per task, without extension:
#   /var/log/pve/tasks/<0-F>/UPID:<node>:<pid>:<pstart>:<starttime>:<type>:<id>:<user>:
# (there are no *.log files below /var/log/pve). task_file carries that name,
# so task type (vzdump, qmigrate, aptupdate ...), guest id and user can be
# searched. Read_from_Head Off only skips the tasks already on disk when
# Fluent Bit starts; files of new tasks are read from their first line.
# =============================================================================

[INPUT]
    Name              tail
    Tag               proxmox.*
    Path              /var/log/pve/tasks/*/UPID:*
    Path_Key          task_file
    Read_from_Head    Off
    DB                /var/log/fluent-bit-proxmox.db
    Skip_Long_Lines   On
    storage.type      filesystem

[FILTER]
    Name          record_modifier
    Match         proxmox.*
    Record        host      ${HOSTNAME}
    Record        log_type  proxmox
    Record        vlan      ${vlan}
    Record        host_ip   ${host_ip}

[OUTPUT]
    Name          http
    Match         proxmox.*
    Host          ${o2_host}
    Port          443
    TLS           On
    TLS.Verify    On
    URI           /api/${o2_org}/proxmox/_json
    Format        json
    HTTP_User     ${o2_user}
    HTTP_Passwd   ${o2_passwd}
    compress      gzip
    Retry_Limit   30
    storage.total_limit_size  256M
