# =============================================================================
# Fluent Bit - Docker Log Input
# Path: /etc/fluent-bit/conf.d/docker.conf
# Deploy on: All Docker hosts
# Requires: Docker configured with fluentd logging driver (see install-log.sh --docker)
# Variables: host_ip, vlan, o2_host, o2_org (set in datacore.conf),
#            o2_user, o2_passwd (set in datacore.env)
# NOTE: The forward input has no authentication. It listens on 127.0.0.1 only -
#       the Docker daemon connects via localhost:24224 (see daemon.json).
# =============================================================================

[INPUT]
    Name          forward
    Listen        127.0.0.1
    Port          24224
    Tag_Prefix    docker.
    storage.type  filesystem

# Drop lines that carry nothing: empty lines, and the "==> file <==" headers
# that tail prints when it switches files. The GitLab Omnibus image tails all
# its log files to stdout that way - in 2026-11 these two made up ~58 % of
# GitLab's ~2.7 M records a day in docker_logs. Each Exclude drops on match.
[FILTER]
    Name          grep
    Match         docker.*
    Exclude       log ^\s*$
    Exclude       log ^==> .+ <==$

[FILTER]
    Name          record_modifier
    Match         docker.*
    Record        host      ${HOSTNAME}
    Record        log_type  docker
    Record        vlan      ${vlan}
    Record        host_ip   ${host_ip}

[OUTPUT]
    Name          http
    Match         docker.*
    Host          ${o2_host}
    Port          443
    TLS           On
    TLS.Verify    On
    TLS.Verify_Hostname  On
    URI           /api/${o2_org}/docker_logs/_json
    Format        json
    HTTP_User     ${o2_user}
    HTTP_Passwd   ${o2_passwd}
    compress      gzip
    Retry_Limit   no_limits
    storage.total_limit_size  256M
