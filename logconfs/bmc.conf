# =============================================================================
# Fluent Bit - BMC/IPMI Syslog Input
# Path: /etc/fluent-bit/conf.d/bmc.conf
# Deploy on: dataCoreLog03 (receives remote syslog from BMC/IPMI boards)
# Variables: host_ip, vlan, o2_host, o2_org (set in datacore.conf),
#            o2_user, o2_passwd (set in datacore.env)
#
# SOURCES (VLAN 20, same subnet as the receiver - no firewall rule needed):
#   dataCoreStorageIPMI  192.168.20.48  ASRockRack BMC
#   dataCoreRootIPMI     192.168.20.47  Supermicro IPMI (optional, same target)
#
# BMC CONFIGURATION (ASRockRack WebUI):
#   Settings -> Log Settings -> Advanced Log Settings
#   Remote Log:         enabled
#   Port Type:          UDP
#   Remote Log Server:  192.168.20.33
#   Remote Server Port: 5141
#
# NOTE: Port 5141 instead of 514 to avoid running Fluent Bit as root.
#       5140 is taken by the UniFi receiver (unifi.conf).
# NOTE: The host field is NOT overridden here: the rfc3164 parser fills it
#       from the syslog header, which identifies the sending BMC - several
#       boards can share this one receiver.
# NOTE: Listens on ${host_ip} only, not 0.0.0.0 - UDP syslog is unauthenticated,
#       so the receiver stays off every other interface (e.g. Docker bridges).
#       Restricting the senders is the job of the host/zone firewall.
# =============================================================================

[INPUT]
    Name          syslog
    Mode          udp
    Listen        ${host_ip}
    Port          5141
    Tag           bmc.*
    Parser        syslog-rfc3164
    storage.type  filesystem

[FILTER]
    Name          record_modifier
    Match         bmc.*
    Record        log_type  bmc
    Record        vlan      ${vlan}
    Record        host_ip   ${host_ip}

[OUTPUT]
    Name          http
    Match         bmc.*
    Host          ${o2_host}
    Port          443
    TLS           On
    TLS.Verify    On
    URI           /api/${o2_org}/bmc_logs/_json
    Format        json
    HTTP_User     ${o2_user}
    HTTP_Passwd   ${o2_passwd}
    compress      gzip
    Retry_Limit   30
    storage.total_limit_size  256M
