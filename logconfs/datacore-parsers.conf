# =============================================================================
# Fluent Bit - dataCore Custom Parsers
# Path: /etc/fluent-bit/datacore-parsers.conf
# Loaded via a second Parsers_File line in datacore.conf (written by
# install-log.sh) — the packaged /etc/fluent-bit/parsers.conf stays untouched.
#
# truenas-rfc5424:
#   TrueNAS (syslog-ng) sends RFC5424 with plain second precision, e.g.
#   "<14>1 2026-08-17T17:14:09+02:00 datacorefs04 ..." (observed 2026-08-17).
#   The packaged syslog-rfc5424 parser expects fractional seconds
#   ("%S.%L%z") and fails on that timestamp, so this parser matches the
#   exact format TrueNAS emits.
#
# unifi-cef:
#   UniFi Network "Activity Logging (Syslog) -> SIEM Server" sends CEF in a
#   BSD-syslog envelope WITHOUT a <pri> prefix (observed 2026-08-17,
#   UniFi Network 10.5.67 on UDM Pro Max):
#     "Aug 17 17:54:49 dataCoreFW05 CEF:0|Ubiquiti|UniFi Network|10.5.67|
#      544|Network Accessed|4|UNIFIcategory=Audit ... msg=..."
#   No packaged parser accepts that. The CEF extension (key=value pairs)
#   stays unsplit in "message" — values contain unescaped spaces, so a
#   regex cannot split it reliably; full-text search covers it.
#   The timestamp has no year/zone: Fluent Bit assumes the current year
#   and the local zone of the receiving host, matching the sender's.
# =============================================================================

[PARSER]
    Name        truenas-rfc5424
    Format      regex
    Regex       ^\<(?<pri>[0-9]{1,5})\>1 (?<time>[^ ]+) (?<host>[^ ]+) (?<ident>[^ ]+) (?<pid>[-0-9]+) (?<msgid>[^ ]+) (?<extradata>(\[(.*?)\]|-)) (?<message>.+)$
    Time_Key    time
    Time_Format %Y-%m-%dT%H:%M:%S%z
    Time_Keep   On

[PARSER]
    Name        unifi-cef
    Format      regex
    Regex       ^(?<time>[A-Z][a-z]{2} +[0-9]{1,2} [0-9]{2}:[0-9]{2}:[0-9]{2}) (?<host>[^ ]+) CEF:0\|(?<vendor>[^|]*)\|(?<product>[^|]*)\|(?<app_version>[^|]*)\|(?<event_id>[^|]*)\|(?<event>[^|]*)\|(?<severity>[^|]*)\|(?<message>.*)$
    Time_Key    time
    Time_Format %b %d %H:%M:%S
