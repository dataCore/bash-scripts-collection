# =============================================================================
# Fluent Bit - Domain Controller AD Event Log Input
# Path: C:\ProgramData\fluent-bit\conf.d\dc.conf
# Deploy on: Domain Controllers (install-log.ps1 -Dc) - IN ADDITION to windows.conf
# Variables: host_ip, vlan, o2_host, o2_org, fb_data (set in datacore.conf),
#            o2_user, o2_passwd (set in datacore-secrets.conf)
#
# This config ONLY covers AD-specific channels.
# Standard event logs (System, Application, Security, Setup) come from windows.conf.
# winevtlog input with its own DB file, see windows.conf for the field names.
# =============================================================================

# --- Input: Active Directory specific event logs ---
[INPUT]
    Name                  winevtlog
    Tag                   dc.ad
    Channels              Directory Service,DNS Server,File Replication Service
    Interval_Sec          10
    Read_Existing_Events  Off
    DB                    ${fb_data}\db\fluent-bit-dc-ad-winevtlog.db
    storage.type          filesystem

[FILTER]
    Name          record_modifier
    Match         dc.*
    Record        host      ${HOSTNAME}
    Record        log_type  domaincontroller
    Record        vlan      ${vlan}
    Record        host_ip   ${host_ip}

# --- Output: OpenObserve - domaincontroller stream ---
[OUTPUT]
    Name          http
    Match         dc.*
    Host          ${o2_host}
    Port          443
    TLS           On
    TLS.Verify    On
    tls.verify_hostname  On
    URI           /api/${o2_org}/domaincontroller/_json
    Format        json
    HTTP_User     ${o2_user}
    HTTP_Passwd   ${o2_passwd}
    compress      gzip
    Retry_Limit   no_limits
    storage.total_limit_size  256M
